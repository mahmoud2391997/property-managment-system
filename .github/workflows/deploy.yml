name: Deploy

on:
  push:
    branches: [staging, main]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Set environment-specific vars
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "vercel_target=production" >> $GITHUB_OUTPUT
            echo "supabase_ref=${{ secrets.PROD_SUPABASE_PROJECT_REF }}" >> $GITHUB_OUTPUT
            echo "supabase_password=${{ secrets.PROD_SUPABASE_DB_PASSWORD }}" >> $GITHUB_OUTPUT
          else
            echo "vercel_target=staging" >> $GITHUB_OUTPUT
            echo "supabase_ref=${{ secrets.STAGING_SUPABASE_PROJECT_REF }}" >> $GITHUB_OUTPUT
            echo "supabase_password=${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}" >> $GITHUB_OUTPUT
          fi

      # ---- STEP 1: BUILD GATE ----
      - name: Pull Vercel env info
        run: vercel pull --yes --environment=${{ steps.env.outputs.vercel_target }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (gate — fails fast on broken code)
        run: vercel build --target=${{ steps.env.outputs.vercel_target }} --token=${{ secrets.VERCEL_TOKEN }}

      # ---- STEP 2: MIGRATIONS ----
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Supabase migrations
        run: |
          supabase link --project-ref ${{ steps.env.outputs.supabase_ref }}
          supabase db push
        env:
          SUPABASE_DB_PASSWORD: ${{ steps.env.outputs.supabase_password }}

      # ---- STEP 3: DEPLOY ----
      - name: Deploy prebuilt to Vercel
        run: vercel deploy --prebuilt --target=${{ steps.env.outputs.vercel_target }} --token=${{ secrets.VERCEL_TOKEN }}
