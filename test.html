<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lease End Date + Rental Months</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    label {
      display: block;
      margin: 15px 0 5px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin-top: 20px;
      padding: 10px 15px;
      width: 100%;
      border: none;
      background: #0070f3;
      color: white;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #005ad1;
    }
    #result, #monthsList {
      margin-top: 20px;
      font-size: 17px;
    }
    ul {
      margin-top: 10px;
      padding-left: 20px;
    }
  </style>
</head>
<body>

  <h2>Lease End Date & Rental Months</h2>

  <label>Start Date:</label>
  <input type="date" id="startDate" />

  <label>Number of Months:</label>
  <input type="number" id="months" min="1" />

  <label>Leave Day (1-31):</label>
  <input type="number" id="leaveDay" min="1" max="31" />

  <button onclick="calculate()">Calculate</button>

  <div id="result"></div>
  <div id="monthsList"></div>

  <script>
    function calculate() {
      const startDate = new Date(document.getElementById('startDate').value);
      const months = parseInt(document.getElementById('months').value, 10);
      const leaveDay = parseInt(document.getElementById('leaveDay').value, 10);

      const result = document.getElementById('result');
      const monthsList = document.getElementById('monthsList');
      monthsList.innerHTML = "";

      if (!startDate || isNaN(months) || isNaN(leaveDay)) {
        result.textContent = "Please fill in all fields.";
        return;
      }

      // 1. Calculate end date
      const endDate = new Date(startDate);
      endDate.setMonth(endDate.getMonth() + months);

      const year = endDate.getFullYear();
      const month = endDate.getMonth();
      const lastDay = new Date(year, month + 1, 0).getDate();
      const finalDay = Math.min(leaveDay, lastDay);
      const finalDate = new Date(year, month, finalDay);

      // Display end date
      result.innerHTML = `<strong>End Date:</strong> ${finalDate.toDateString()}`;

      // 2. List all rental months
      const list = document.createElement("ul");
      const cursor = new Date(startDate);

      while (cursor <= finalDate) {
        const monthName = cursor.toLocaleString('default', { month: 'long' });
        const entry = document.createElement("li");
        entry.textContent = `${monthName} ${cursor.getFullYear()}`;
        list.appendChild(entry);

        cursor.setMonth(cursor.getMonth() + 1);
      }

      monthsList.innerHTML = "<strong>Rental Months:</strong>";
      monthsList.appendChild(list);
    }
  </script>

</body>
</html>
